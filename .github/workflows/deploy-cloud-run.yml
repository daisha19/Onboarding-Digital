name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-main
  cancel-in-progress: false

env:
  PROJECT_ID: onboarding-digital-500319
  REGION: us-central1
  REPOSITORY: onboarding
  BACKEND_SERVICE: onboarding-backend
  FRONTEND_SERVICE: onboarding-frontend
  GCS_BUCKET_NAME: onboarding-digital-arquivos

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure project
        run: gcloud config set project "$PROJECT_ID"

      - name: Run database migrations
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=database-url)"
          alembic upgrade head

      - name: Build and push backend
        run: |
          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${BACKEND_SERVICE}:main-${GITHUB_SHA}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit ./backend --tag "$BACKEND_IMAGE"

      - name: Deploy backend
        run: |
          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --region "$REGION" \
            --format='value(status.url)' 2>/dev/null || true)"

          if [ -z "$FRONTEND_URL" ]; then
            FRONTEND_URL="http://localhost:3000"
          fi

          gcloud run deploy "$BACKEND_SERVICE" \
            --image "$BACKEND_IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --set-secrets DATABASE_URL=database-url:latest,SECRET_KEY=secret-key:latest \
            --set-env-vars ACCESS_TOKEN_EXPIRE_MINUTES=60,UPLOAD_MAX_SIZE_MB=10,DOCUMENT_STORAGE_BACKEND=gcs,GCS_BUCKET_NAME="${GCS_BUCKET_NAME}",GCS_UPLOAD_PREFIX=documentos,BACKEND_CORS_ORIGINS="${FRONTEND_URL}"

      - name: Build and push frontend
        run: |
          BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$REGION" \
            --format='value(status.url)')"
          FRONTEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_SERVICE}:main-${GITHUB_SHA}"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"

          cat > /tmp/frontend-cloudbuild.yaml <<EOF
          steps:
            - name: gcr.io/cloud-builders/docker
              args:
                - build
                - --build-arg
                - NEXT_PUBLIC_API_BASE_URL=${BACKEND_URL}
                - -t
                - ${FRONTEND_IMAGE}
                - .
          images:
            - ${FRONTEND_IMAGE}
          EOF

          gcloud builds submit ./frontend --config /tmp/frontend-cloudbuild.yaml

      - name: Deploy frontend
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image "$FRONTEND_IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1

      - name: Update backend CORS
        run: |
          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --region "$REGION" \
            --format='value(status.url)')"

          gcloud run services update "$BACKEND_SERVICE" \
            --region "$REGION" \
            --update-env-vars BACKEND_CORS_ORIGINS="$FRONTEND_URL"

      - name: Smoke test
        run: |
          BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$REGION" \
            --format='value(status.url)')"
          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --region "$REGION" \
            --format='value(status.url)')"

          curl --fail "$BACKEND_URL/health"
          curl --fail "$BACKEND_URL/health/db"
          curl --fail "$FRONTEND_URL/api/health"

          echo "Backend: $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"
